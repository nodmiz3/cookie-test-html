<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メインページ</title>

<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --scale: 1;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    padding: calc(1rem * var(--scale));
    font-size: calc(1rem * var(--scale));
    transition: 0.2s;
  }

  .btn {
    padding: calc(0.8rem * var(--scale)) calc(1.2rem * var(--scale));
    font-size: calc(1rem * var(--scale));
    border-radius: 6px;
    border: none;
    cursor: pointer;
    background: #ddd;
  }
</style>
</head>
<body>

<h1>メインページ</h1>

<p id="greeting">読み込み中…</p>

<a href="settings.html">
  <button class="btn">設定を開く</button>
</a>

<script>
  function load(key, def = null) {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  }

  function applyTheme(theme) {
    if (theme === "dark") {
      document.documentElement.style.setProperty("--bg", "#111");
      document.documentElement.style.setProperty("--text", "#eee");
    } else {
      document.documentElement.style.setProperty("--bg", "#fff");
      document.documentElement.style.setProperty("--text", "#000");
    }
  }

  const osDark = window.matchMedia("(prefers-color-scheme: dark)");

  function applyOSTheme() {
    const saved = load("theme");
    applyTheme(saved ? saved : (osDark.matches ? "dark" : "light"));
  }

  osDark.addEventListener("change", applyOSTheme);

  window.onload = () => {
    const name = load("username", "ゲスト");
    document.getElementById("greeting").textContent = `${name}さん、こんにちは！`;

    const scale = load("scale", 1);
    document.documentElement.style.setProperty("--scale", scale);

    applyOSTheme();
  };
</script>

</body>
</html>
