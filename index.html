<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Cookieデモ</title>
</head>
<body>
  <h1>Cookieで名前を記憶するデモ</h1>

  <p id="greeting">はじめまして！名前を教えてください。</p>

  <input type="text" id="nameInput" placeholder="名前を入力">
  <button id="saveBtn">保存</button>
  <button id="clearBtn">Cookie削除</button>

  <script>
    // Cookieをセット
    function setCookie(name, value, days) {
      let expires = "";
      if (days) {
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/";
    }

    // Cookieを取得
    function getCookie(name) {
      const nameEQ = name + "=";
      const ca = document.cookie.split(";");
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) === " ") c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) === 0) {
          return decodeURIComponent(c.substring(nameEQ.length, c.length));
        }
      }
      return null;
    }

    // Cookie削除
    function deleteCookie(name) {
      document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }

    const greeting = document.getElementById("greeting");
    const nameInput = document.getElementById("nameInput");
    const saveBtn = document.getElementById("saveBtn");
    const clearBtn = document.getElementById("clearBtn");

    // ページ読み込み時にCookieをチェック
    window.onload = function () {
      const savedName = getCookie("username");
      if (savedName) {
        greeting.textContent = savedName + "さん、おかえりなさい！";
        nameInput.value = savedName;
      }
    };

    // 保存ボタン：名前をCookieに保存
    saveBtn.onclick = function () {
      const name = nameInput.value.trim();
      if (!name) {
        alert("名前を入力してください");
        return;
      }
      setCookie("username", name, 7); // 7日間有効
      greeting.textContent = name + "さん、保存しました！次回もこの名前で挨拶します。";
    };

    // 削除ボタン：Cookie削除
    clearBtn.onclick = function () {
      deleteCookie("username");
      greeting.textContent = "Cookieを削除しました。はじめまして！名前を教えてください。";
      nameInput.value = "";
    };
  </script>
</body>
</html>
