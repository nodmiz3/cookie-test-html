<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<!-- ★スマホで縮小されないための最重要タグ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cookie統合デモ（スマホ対応）</title>

<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --btn-size: 1rem; /* スマホで見やすいサイズ */
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    padding: 1rem;
    line-height: 1.6;
  }

  input {
    width: 100%;
    padding: 0.8rem;
    font-size: 1rem;
    margin-bottom: 1rem;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .btn {
    display: inline-block;
    padding: 0.8rem 1.2rem;
    font-size: 1rem;
    margin: 0.5rem 0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .light { background: #ddd; }
  .dark { background: #333; color: #fff; }
</style>
</head>
<body>

<h1>Cookie統合デモ（スマホ対応）</h1>

<p id="greeting">はじめまして！名前を教えてください。</p>
<input type="text" id="nameInput" placeholder="名前を入力">
<button class="btn" id="saveNameBtn">名前を保存</button>
<button class="btn" id="clearNameBtn">名前Cookie削除</button>

<hr>

<h2>テーマ切り替え</h2>
<button class="btn light" onclick="setTheme('light')">ライトテーマ</button>
<button class="btn dark" onclick="setTheme('dark')">ダークテーマ</button>

<script>
  function setCookie(name, value, days) {
    const date = new Date();
    date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
    document.cookie = `${name}=${encodeURIComponent(value)}; expires=${date.toUTCString()}; path=/`;
  }

  function getCookie(name) {
    const cookies = document.cookie.split("; ");
    for (const c of cookies) {
      const [key, val] = c.split("=");
      if (key === name) return decodeURIComponent(val);
    }
    return null;
  }

  function deleteCookie(name) {
    document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/`;
  }

  const greeting = document.getElementById("greeting");
  const nameInput = document.getElementById("nameInput");

  window.onload = () => {
    const savedName = getCookie("username");
    if (savedName) {
      greeting.textContent = `${savedName}さん、おかえりなさい！`;
      nameInput.value = savedName;
    }

    const savedTheme = getCookie("theme");
    if (savedTheme) applyTheme(savedTheme);
  };

  document.getElementById("saveNameBtn").onclick = () => {
    const name = nameInput.value.trim();
    if (!name) {
      alert("名前を入力してください");
      return;
    }
    setCookie("username", name, 30);
    greeting.textContent = `${name}さん、保存しました！`;
  };

  document.getElementById("clearNameBtn").onclick = () => {
    deleteCookie("username");
    greeting.textContent = "Cookieを削除しました。はじめまして！名前を教えてください。";
    nameInput.value = "";
  };

  function applyTheme(theme) {
    if (theme === "dark") {
      document.documentElement.style.setProperty("--bg", "#111");
      document.documentElement.style.setProperty("--text", "#eee");
    } else {
      document.documentElement.style.setProperty("--bg", "#fff");
      document.documentElement.style.setProperty("--text", "#000");
    }
  }

  function setTheme(theme) {
    applyTheme(theme);
    setCookie("theme", theme, 30);
  }
</script>

</body>
</html>
